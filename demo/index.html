<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Demo interactiva | Aaron Chavez Dev</title><style>*{box-sizing:border-box}body{margin:0;background:#080d16;color:#eaf1fa;font:16px system-ui;line-height:1.6}main{max-width:1100px;margin:auto;padding:28px}a{color:#38bdf8}header,nav,.stats{display:flex;gap:12px;flex-wrap:wrap;align-items:center}header{justify-content:space-between}h1{font-size:clamp(25px,4vw,40px);line-height:1.2}button,input,select{font:inherit;color:inherit;background:#142236;border:1px solid #344a64;border-radius:8px;padding:10px}button{cursor:pointer}button[aria-pressed=true]{background:#38bdf8;color:#08111b}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #38bdf8}section,.stat{background:#111c2d;border:1px solid #293e55;border-radius:12px;padding:20px;margin-top:16px}.stat{flex:1;min-width:130px}.stat strong{display:block;font-size:32px;color:#38bdf8}.muted{color:#a5b5c9}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:12px;border-bottom:1px solid #293e55;white-space:nowrap}input{max-width:100%;width:350px}label{display:block;margin:10px 0}.bar{background:#26394e;border-radius:8px;height:12px;overflow:hidden}.bar i{display:block;background:#38bdf8;height:100%}footer{margin-top:25px}</style></head><body><main><header><a id="back" href="/">← Aaron Chavez Dev</a><a id="language" href="?lang=en">EN</a></header><p class="muted" id="notice">Entorno demostrativo · Datos ficticios · Sin conexión al sistema real</p><h1 id="heading">Demo de gestión empresarial</h1><p id="intro">Explora una simulación de los módulos de gestión de profesionales, proyectos y validaciones.</p><nav id="nav" aria-label="Módulos"></nav><section id="content" aria-live="polite"></section><footer><a id="quote" href="/#contacto">Cotizar una solución similar ↗</a></footer></main><script>
const en=new URLSearchParams(location.search).get('lang')==='en', t=(es,english)=>en?english:es;document.documentElement.lang=en?'en':'es'; const $=id=>document.getElementById(id);$('back').href=en?'/en/':'/';$('language').href=en?'?lang=es':'?lang=en';$('language').textContent=en?'ES':'EN';$('notice').textContent=t('Entorno demostrativo · Datos ficticios · Sin conexión al sistema real','Illustrative demo · Synthetic data · No connection to the real system');$('heading').textContent=t('Demo de gestión empresarial','Enterprise management demo');$('intro').textContent=t('Explora una simulación de los módulos de gestión de profesionales, proyectos y validaciones.','Explore simulated professional, project and validation modules.');$('quote').href=(en?'/en/':'/')+'#contacto';$('quote').textContent=t('Cotizar una solución similar ↗','Request a similar solution ↗');
const people=[['PRO-001',t('Ingeniería civil','Civil engineering'),12],['PRO-002',t('Arquitectura','Architecture'),8],['PRO-003',t('Ingeniería industrial','Industrial engineering'),6],['PRO-004',t('Ingeniería civil','Civil engineering'),10]], projects=[['PR-001',t('Infraestructura vial','Road infrastructure'),'PRO-001'],['PR-002',t('Centro educativo','Education center'),'PRO-002'],['PR-003',t('Modernización de instalaciones','Facility modernization'),'PRO-003']], docs=[['DOC-001','PRO-001','valid'],['DOC-002','PRO-002','pending'],['DOC-003','PRO-003','pending'],['DOC-004','PRO-004','valid']];const states={valid:t('Validado','Validated'),pending:t('Pendiente','Pending'),sent:t('Enviado','Sent'),observed:t('Observado','Flagged')};const tabs=[t('Resumen','Overview'),t('Profesionales','Professionals'),t('Proyectos','Projects'),t('Validaciones','Validations')];let active=0;const table=(heads,rows)=>'<div class="scroll"><table><thead><tr>'+heads.map(x=>'<th scope="col">'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';function render(i){active=i;document.querySelectorAll('#nav button').forEach((b,k)=>b.setAttribute('aria-pressed',String(i===k)));let c=$('content');if(i===0){c.innerHTML='<h2>'+tabs[0]+'</h2><div class="stats">'+[[tabs[1],people.length],[tabs[2],projects.length],[t('Pendientes','Pending'),docs.filter(d=>d[2]==='pending').length]].map(([a,b])=>'<div class="stat">'+a+'<strong>'+b+'</strong></div>').join('')+'</div><h3>'+t('Distribución por especialidad','Distribution by specialty')+'</h3>'+[...new Set(people.map(p=>p[1]))].map(a=>{let n=people.filter(p=>p[1]===a).length;return '<p>'+a+' · '+n+'</p><div class="bar"><i style="width:'+n/people.length*100+'%"></i></div>'}).join('');}if(i===1){c.innerHTML='<h2>'+tabs[1]+'</h2><label for="search">'+t('Buscar por código o especialidad','Search by ID or specialty')+'</label><input id="search" type="search"><div id="results"></div>';let update=()=>{$('results').innerHTML=table([t('Código','ID'),t('Especialidad','Specialty'),t('Años de experiencia (simulados)','Years of experience (simulated)')],people.filter(p=>p.join(' ').toLowerCase().includes($('search').value.toLowerCase())))};$('search').addEventListener('input',update);update();}if(i===2)c.innerHTML='<h2>'+tabs[2]+'</h2>'+table([t('Código','ID'),t('Proyecto ficticio','Fictional project'),t('Asignación','Assignment')],projects);if(i===3){c.innerHTML='<h2>'+tabs[3]+'</h2><p>'+t('Prueba cambiar un estado. Los cambios son temporales y no se guardan.','Try changing a status. Changes are temporary and not saved.')+'</p>'+table([t('Documento','Document'),t('Profesional','Professional'),t('Estado','Status')],docs.map((d,k)=>[d[0],d[1],'<select aria-label="'+d[0]+'" data-id="'+k+'">'+Object.entries(states).map(([key,label])=>'<option value="'+key+'" '+(key===d[2]?'selected':'')+'>'+label+'</option>').join('')+'</select>']));c.querySelectorAll('select').forEach(s=>s.addEventListener('change',()=>{docs[Number(s.dataset.id)][2]=s.value}));}}tabs.forEach((name,i)=>{let b=document.createElement('button');b.textContent=name;b.type='button';b.addEventListener('click',()=>render(i));$('nav').append(b)});render(0);
</script></body></html>
